# Publishes a GitHub Release when a tag of the form v<version> is pushed,
# e.g. v1.0.1. The release gets a ZIP of the extension as its asset, and
# GitHub counts downloads per asset.
#
# To cut a release (see RELEASING.md):
#   git tag v1.0.1
#   git push origin v1.0.1

name: Release extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag against the manifest version
        id: meta
        run: |
          ver="${GITHUB_REF_NAME#v}"
          manifest_ver=$(grep -oP '"version"\s*:\s*"\K[^"]+' manifest.json)
          if [ "$manifest_ver" != "$ver" ]; then
            echo "Tag version $ver does not match manifest.json version $manifest_ver" >&2
            exit 1
          fi
          echo "ver=$ver" >> "$GITHUB_OUTPUT"

      # The ZIP holds the extension in a show-imdb-ratings folder, with the
      # README, privacy policy and LICENSE but not the store material or
      # this workflow. It ships no ratings data: the extension builds its
      # database in each user's browser from IMDb's dumps, which IMDb
      # licenses for personal use only.
      - name: Zip the extension
        run: |
          git archive --format=zip --prefix=show-imdb-ratings/ \
            -o "show-imdb-ratings-v${{ steps.meta.outputs.ver }}.zip" HEAD -- . \
            ':!store' ':!.github' ':!.gitignore' ':!RELEASING.md'

      - name: Create the release with the ZIP attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${{ steps.meta.outputs.ver }}"
          gh release create "$GITHUB_REF_NAME" "show-imdb-ratings-v$ver.zip" \
            --title "v$ver" \
            --notes "Download the ZIP, extract it, then in Chrome open chrome://extensions, turn on Developer mode, click **Load unpacked** and pick the \`show-imdb-ratings\` folder. Details in the [README](https://github.com/${GITHUB_REPOSITORY}#readme)."
